# .github/workflows/ci.yml
name: CI
on: [push, pull_request]        # 什麼時候跑：每次 push 與每個 PR

jobs:
  test:
    runs-on: ubuntu-latest      # 在哪跑：GitHub 提供的乾淨 Linux 機器
    strategy:
      matrix:                   # 本 repo 的 App 有兩個版本目錄（Lab 9、Lab 10），都要測（適配教材）
        dir: [labs/lab09-ship-it, labs/lab10-graduation]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4      # 現成積木：抓下你的程式碼（版本見附錄 B）
      - uses: actions/setup-node@v4    # 現成積木：裝好 Node
      - run: for t in test_*.js; do node "$t"; done   # 跑你的單元測試（test_srs.js、Lab 10 再加 test_csv.js）
      - run: node check_words.js       # 跑你的資料檢查
