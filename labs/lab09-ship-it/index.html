<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<title>YTP VocaBuddy</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f4f6f5;margin:0;padding:24px;text-align:center}
  h1{color:#0f766e}
  #stats{color:#666;font-size:.95rem}
  #card{max-width:340px;margin:24px auto 8px;padding:36px 24px;background:#fff;border-radius:14px;
        box-shadow:0 4px 16px rgba(0,0,0,.08);font-size:2rem;user-select:none}
  #meaning{color:#0f766e;font-size:1.2rem;min-height:1.6em}
  button{margin:8px 6px 0;padding:10px 22px;font-size:1rem;border:none;border-radius:8px;
         background:#0f766e;color:#fff;cursor:pointer}
  button.warn{background:#b3403a}
</style>
</head>
<body>
<h1>YTP VocaBuddy</h1>
<p id="stats"></p>
<div id="card">—</div>
<p id="meaning">&nbsp;</p>
<p id="ai" style="max-width:340px;margin:8px auto;color:#555"></p>
<div>
  <button id="reveal" onclick="reveal()">顯示答案</button>
  <button id="ok" onclick="mark(true)" hidden>記得 ✓</button>
  <button id="no" onclick="mark(false)" class="warn" hidden>忘了 ✗</button>
  <button id="aiBtn" onclick="aiExample()" hidden>AI 例句</button>
</div>
<div style="margin-top:20px">
  <button onclick="smartQuiz()">考我弱點</button>
  <div id="quiz" style="max-width:340px;margin:8px auto;color:#333"></div>
</div>
<script src="words.js"></script>
<script src="srs.js"></script>
<script>
// 單字包已搬到 words.js（Sprint 4：全隊共編，進 Git）

// 學習紀錄：只屬於這台裝置，所以放 localStorage（讀寫都包 try/catch）
let log = {};
try { log = JSON.parse(localStorage.getItem("vb-log")) || {}; } catch(e){}
function save(){ try { localStorage.setItem("vb-log", JSON.stringify(log)); } catch(e){} }

// —— 日期：以「第幾天」為單位，附時間旅行測試器 ——
let dayOffset = 0;
try { dayOffset = +localStorage.getItem("vb-day") || 0; } catch(e){}
const today = () => Math.floor(Date.now() / 864e5) + dayOffset;
window.vbTravel = n => {            // Console 輸入 vbTravel(1) 即快轉一天
  try { localStorage.setItem("vb-day", dayOffset + n); } catch(e){}
  location.reload();
};

function stateOf(w){
  const s = log[w.en] || (log[w.en] = { seen:0, wrong:0 });
  if (s.box === undefined){ s.box = 1; s.due = today(); }   // 舊紀錄自動升級
  return s;
}

let queue = WORDS.filter(w => stateOf(w).due <= today());   // 只複習「到期」的卡
let cur = null;

const $ = id => document.getElementById(id);

function next(){
  $("aiBtn").hidden = true;          // Sprint 2：換卡時藏回 AI 鈕、清空例句
  $("ai").textContent = "";
  if (queue.length === 0){
    $("card").textContent = "今天沒有到期的卡——明天見！";
    $("meaning").innerHTML = "&nbsp;";
    $("reveal").hidden = $("ok").hidden = $("no").hidden = true;
    return;
  }
  cur = queue[0];
  $("card").textContent = cur.en;
  $("meaning").innerHTML = "&nbsp;";
  $("reveal").hidden = false;
  $("ok").hidden = $("no").hidden = true;
  stats();
}

function reveal(){
  $("meaning").textContent = cur.zh;
  $("reveal").hidden = true;
  $("ok").hidden = $("no").hidden = false;
  $("aiBtn").hidden = false;         // Sprint 2：翻面後才給 AI 例句
}

function mark(ok){
  const s = stateOf(cur);
  s.seen++; if (!ok) s.wrong++;
  const r = schedule(s.box, ok, today());   // ← 排程交給純函式
  s.box = r.box; s.due = r.due;
  save();
  if (ok) queue.shift();
  else queue.push(queue.shift());   // 忘了的排到今天隊尾，等一下再考一次
  next();
}

function stats(){
  $("stats").textContent = "今日佇列：剩 " + queue.length + " 張";
}

// ---------- Sprint 2：AI 例句（fetch 直呼 API、使用者自帶金鑰、快取、降階） ----------
const MODEL = "claude-sonnet-5-5";   // 教材 claude-sonnet-4-5 已非當前世代（勘誤 E-007）；最新名稱見附錄 B
const API_VERSION = "2023-06-01";    // anthropic-version 標頭值，見附錄 B

function getKey(){
  let k = null;
  try { k = localStorage.getItem("vb-key"); } catch(e){}
  if (!k){
    k = prompt("貼上你的 API key（只存在你自己的瀏覽器）");
    try { localStorage.setItem("vb-key", k); } catch(e){}
  }
  return k;
}

// 回應的 content 是「區塊列表」，新模型可能先回 thinking 區塊，依 type 只挑 text（勘誤 E-009）
const textOf = data => data.content.filter(b => b.type === "text").map(b => b.text).join("");

// Sprint 4：把 Sprint 2 的 fetch 抽成共用函式（教材只說「抽成共用函式」未給程式，由本 repo 補；
// 內容與 Lab 6 原碼相同，含四處新模型修改：MODEL E-007、無 temperature E-014、textOf E-009、max_tokens E-011）
async function callClaude(system, user){
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": getKey(),
      "anthropic-version": API_VERSION,
      "anthropic-dangerous-direct-browser-access": "true"  // 瀏覽器直呼必加，見附錄 B
    },
    body: JSON.stringify({
      model: MODEL, max_tokens: 1024,   // 教材 300；thinking 的 token 也算在內（勘誤 E-011）
      // 教材有 temperature: 0.3；claude-sonnet-5-5 不接受 temperature，會回 400（勘誤 E-014）
      system: system,
      messages: [{ role: "user", content: user }]
    })
  });
  const data = await res.json();
  return textOf(data);                              // 教材：data.content[0].text（勘誤 E-009）
}

async function aiExample(){
  const word = cur.en, box = $("ai");
  let cache = {};
  try { cache = JSON.parse(localStorage.getItem("vb-ai")) || {}; } catch(e){}
  if (cache[word]) return show(cache[word]);        // 快取命中：不花錢、離線可用
  box.textContent = "生成中…";
  try {
    const c = JSON.parse(await callClaude(          // Sprint 4：fetch 抽成共用函式 callClaude()
      '你是高中英語老師。只輸出 JSON：{"sentence":"...","zh":"...","tip":"..."}，不要 markdown 圍欄',
      "用單字 " + word + " 造一個 CEFR B1 例句、中譯與聯想"));
    if (!c.sentence.toLowerCase().includes(word.toLowerCase()))
      throw new Error("例句沒包含目標單字");
    cache[word] = c;
    try { localStorage.setItem("vb-ai", JSON.stringify(cache)); } catch(e){}
    show(c);
  } catch (e) {
    box.textContent = "AI 暫時不可用——不影響複習，例句之後再補。";
  }
  function show(c){
    box.innerHTML = "<em>" + c.sentence + "</em><br>" + c.zh + "<br>聯想：" + c.tip;
  }
}

// ---------- Sprint 4：弱點檢索（RAG-lite）與智慧出題 ----------
function weakest(k){
  return WORDS
    .map(w => { const s = log[w.en] || {seen:0, wrong:0};
                return { en: w.en, zh: w.zh, rate: s.wrong / (s.seen || 1) }; })
    .sort((a, b) => b.rate - a.rate)
    .slice(0, k);
}

async function smartQuiz(){
  const t = weakest(3);
  const box = $("quiz");
  box.textContent = "出題中…";
  try {
    const text = await callClaude(                       // 把 Sprint 2 的 fetch 抽成共用函式
      '你是出題老師。只輸出 JSON：{"question":"...","options":["..","..","..",".."],' +
      '"answer":"..","why":".."}。question 是含 ____ 的英文克漏字句。不要 markdown 圍欄。',
      "使用者最常錯的單字：" + t.map(w => w.en + "（" + w.zh + "）").join("、") +
      "。從中挑一個出一題四選一，選項要包含正確答案與三個貼近的干擾項。");
    const q = JSON.parse(text);
    if (!Array.isArray(q.options) || q.options.length !== 4 ||
        !q.options.includes(q.answer)) throw new Error("題目格式不合格");
    box.innerHTML = "<p>" + q.question + "</p>";
    q.options.forEach(op => {
      const b = document.createElement("button");
      b.textContent = op;
      b.onclick = () => {
        const ok = op === q.answer;
        const s = log[q.answer] || (log[q.answer] = {seen:0, wrong:0});
        s.seen++; if (!ok) s.wrong++;                     // 答題結果寫回紀錄：閉環
        save();
        box.innerHTML += ok ? "<p>答對！" + q.why + "</p>"
                            : "<p>正解：" + q.answer + "。" + q.why + "</p>";
      };
      box.appendChild(b);
    });
  } catch (e) {
    box.textContent = "AI 暫時不可用，先用單字卡複習吧。";
  }
}

next();

// script 最末尾：註冊 service worker（Lab 9 PWA）
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
